name: Вакансии — ежедневное обновление

on:
  schedule:
    - cron: "17 5 * * *"   # каждый день в 05:17 UTC = 07:17 по Риге (зимой)
  workflow_dispatch:        # кнопка «Run workflow» для ручного запуска

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests beautifulsoup4
      - run: python scraper.py
      - name: Сохранить результат
        run: |
          git config user.name "vacancy-bot"
          git config user.email "vacancy-bot@users.noreply.github.com"
          git add data/jobs.json
          git diff --staged --quiet || git commit -m "Вакансии $(date +%F)"
          git push
