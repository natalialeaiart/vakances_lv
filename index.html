<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Вакансии · лента</title>
<style>
  :root{
    --bg:#f6f4ef; --paper:#fffdf8; --ink:#1d1c1a; --muted:#7b776f; --line:#e3ded3;
    --accent:#2f4b3f; --accent-soft:#e4ebe6; --new:#a4492b;
    --serif: "Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;
    --sans: -apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,Helvetica,Arial,sans-serif;
  }
  @media (prefers-color-scheme: dark){
    :root{ --bg:#151513; --paper:#1c1c19; --ink:#ece8df; --muted:#958f84; --line:#2e2d29;
           --accent:#a9c4b5; --accent-soft:#25302a; --new:#e08a68; }
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 var(--sans);-webkit-font-smoothing:antialiased}
  .wrap{max-width:820px;margin:0 auto;padding:48px 22px 80px}
  header h1{font:400 44px/1.05 var(--serif);letter-spacing:-.01em;margin:0 0 10px}
  header p{margin:0;color:var(--muted);font-size:13px;letter-spacing:.02em}
  .controls{position:sticky;top:0;z-index:5;background:var(--bg);padding:18px 0 14px;margin:26px 0 8px;border-bottom:1px solid var(--line)}
  .chips{display:flex;flex-wrap:wrap;gap:7px}
  .chip{font:500 13px var(--sans);border:1px solid var(--line);background:transparent;color:var(--muted);
        padding:6px 12px;border-radius:999px;cursor:pointer;transition:.15s}
  .chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
  .chip .n{opacity:.6;margin-left:4px;font-weight:400}
  .row2{display:flex;flex-wrap:wrap;gap:18px;margin-top:12px;font-size:13px;color:var(--muted)}
  .row2 label{display:flex;align-items:center;gap:6px;cursor:pointer}
  .row2 input{accent-color:var(--accent)}
  h2{font:400 13px var(--sans);letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin:38px 0 6px;display:flex;gap:10px;align-items:baseline}
  h2 b{font-weight:600;color:var(--ink)}
  h3{font:italic 400 15px var(--serif);color:var(--muted);margin:22px 0 2px}
  .job{display:grid;grid-template-columns:1fr auto;gap:4px 16px;padding:16px 0;border-bottom:1px solid var(--line)}
  .job a.t{font:400 20px/1.3 var(--serif);color:var(--ink);text-decoration:none}
  .job a.t:hover{color:var(--accent);text-decoration:underline;text-underline-offset:3px;text-decoration-thickness:1px}
  .meta{grid-column:1;color:var(--muted);font-size:13.5px}
  .meta .co{color:var(--ink)}
  .desc{grid-column:1;color:var(--muted);font-size:13.5px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .tags{grid-column:1;display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
  .tag{font-size:11.5px;letter-spacing:.03em;padding:2px 8px;border-radius:4px;background:var(--accent-soft);color:var(--accent)}
  .tag.warn{background:transparent;border:1px dashed var(--line);color:var(--muted)}
  .tag.new{background:transparent;color:var(--new);padding-left:0;font-weight:600}
  .hide{grid-column:2;grid-row:1 / span 3;align-self:start;font:13px var(--sans);background:none;border:0;color:var(--muted);cursor:pointer;padding:4px 0}
  .hide:hover{color:var(--ink)}
  .job.seen{opacity:.45}
  .empty{color:var(--muted);font-style:italic;font-family:var(--serif);padding:14px 0}
  footer{margin-top:50px;color:var(--muted);font-size:12px}
  footer a{color:inherit;text-underline-offset:2px}
  footer a:hover{color:var(--ink)}
  @media (max-width:560px){ header h1{font-size:34px} .job a.t{font-size:18px} }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Вакансии</h1>
    <p id="sub">загрузка…</p>
  </header>

  <div class="controls">
    <div class="chips" id="chips"></div>
    <div class="row2">
      <label><input type="checkbox" id="onlyRemote"> только удалённо</label>
      <label><input type="checkbox" id="showSeen"> показать скрытые</label>
    </div>
  </div>

  <h2>Новые сегодня <b id="nNew"></b></h2>
  <div id="today"></div>

  <h2>Архив · <span id="days">30</span> дней <b id="nOld"></b></h2>
  <div id="archive"></div>

  <footer>Источники: cv.lv · cvmarket.lv · ss.lv · обновляется раз в день · <a href="https://github.com/natalialeaiart/vakances_lv/actions/workflows/daily.yml" target="_blank" rel="noopener">запустить вручную</a></footer>
</div>

<script>
const store = {
  get(k, d){ try{ const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; }catch(e){ return d; } },
  set(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }
};
const TAGS = { remote:"удалённо", hybrid:"гибрид", no_city:"город не указан", by_desc:"по описанию" };
const fmtDate = iso => new Date(iso + "T12:00:00").toLocaleDateString("ru-RU", {day:"numeric", month:"long", weekday:"short"});
const ago = (iso, today) => {
  const d = Math.round((new Date(today) - new Date(iso)) / 864e5);
  return d <= 0 ? "сегодня" : d === 1 ? "вчера" : d + " дн. назад";
};
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

let DATA, off = new Set(store.get("groupsOff", [])), seen = new Set(store.get("seen", []));

function render(){
  const onlyRemote = document.getElementById("onlyRemote").checked;
  const showSeen = document.getElementById("showSeen").checked;
  const names = Object.fromEntries(DATA.groups.map(g => [g.id, g.name]));

  // счётчики по группам (без учёта скрытых)
  const counts = {};
  DATA.jobs.forEach(j => { if (!seen.has(j.id)) j.groups.forEach(g => counts[g] = (counts[g] || 0) + 1); });
  document.getElementById("chips").innerHTML = DATA.groups.map(g =>
    `<button class="chip" data-g="${g.id}" aria-pressed="${!off.has(g.id)}">${esc(g.name)}<span class="n">${counts[g.id] || 0}</span></button>`
  ).join("");

  const visible = DATA.jobs.filter(j =>
    j.groups.some(g => !off.has(g)) &&
    (!onlyRemote || j.tags.includes("remote")) &&
    (showSeen || !seen.has(j.id))
  );

  const card = j => `
    <article class="job ${seen.has(j.id) ? "seen" : ""}">
      <a class="t" href="${esc(j.url)}" target="_blank" rel="noopener">${esc(j.title)}</a>
      <div class="meta"><span class="co">${esc(j.company)}</span>${j.location ? " · " + esc(j.location) : ""} · ${esc(j.source)} · ${ago(j.posted, DATA.today)}</div>
      ${j.description ? `<div class="desc">${esc(j.description)}</div>` : ""}
      <div class="tags">
        ${j.groups.map(g => `<span class="tag">${esc(names[g] || g)}</span>`).join("")}
        ${j.tags.map(t => `<span class="tag ${t === "remote" || t === "hybrid" ? "" : "warn"}">${TAGS[t] || t}</span>`).join("")}
      </div>
      <button class="hide" data-id="${esc(j.id)}">${seen.has(j.id) ? "вернуть" : "скрыть"}</button>
    </article>`;

  const fresh = visible.filter(j => j.first_seen === DATA.today);
  const old = visible.filter(j => j.first_seen !== DATA.today);
  document.getElementById("nNew").textContent = fresh.length;
  document.getElementById("nOld").textContent = old.length;
  document.getElementById("today").innerHTML = fresh.length ? fresh.map(card).join("") : `<div class="empty">Сегодня новых нет.</div>`;

  let html = "", last = "";
  old.forEach(j => { if (j.first_seen !== last){ last = j.first_seen; html += `<h3>${fmtDate(last)}</h3>`; } html += card(j); });
  document.getElementById("archive").innerHTML = html || `<div class="empty">Пока пусто.</div>`;
}

document.addEventListener("click", e => {
  const chip = e.target.closest(".chip");
  if (chip){ const g = chip.dataset.g; off.has(g) ? off.delete(g) : off.add(g); store.set("groupsOff", [...off]); render(); }
  const hb = e.target.closest(".hide");
  if (hb){ const id = hb.dataset.id; seen.has(id) ? seen.delete(id) : seen.add(id); store.set("seen", [...seen]); render(); }
});
["onlyRemote","showSeen"].forEach(id => {
  const el = document.getElementById(id);
  el.checked = store.get(id, false);
  el.addEventListener("change", () => { store.set(id, el.checked); render(); });
});

(window.EMBEDDED_DATA ? Promise.resolve(window.EMBEDDED_DATA)
  : fetch("data/jobs.json?" + Date.now()).then(r => r.json()))
  .then(d => {
    DATA = d;
    document.getElementById("sub").textContent = `обновлено ${d.updated} · ${d.jobs.length} вакансий`;
    if (d.archive_days) document.getElementById("days").textContent = d.archive_days;
    // чистим «скрытые» от вакансий, которых уже нет в ленте
    const ids = new Set(d.jobs.map(j => j.id)); seen = new Set([...seen].filter(id => ids.has(id))); store.set("seen", [...seen]);
    render();
  })
  .catch(() => { document.getElementById("sub").textContent = "Данных пока нет — бот ещё не запускался."; });
</script>
</body>
</html>
